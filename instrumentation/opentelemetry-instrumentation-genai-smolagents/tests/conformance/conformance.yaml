runner: genai-conformance
instrumented_library: smolagents
instrumentation_library: opentelemetry-instrumentation-genai-smolagents

env:
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

expected_violations:
  - id: genai_expected_attribute_missing
    context:
      operation: chat
      missing_attribute: server.address
    reason: does not listen on socket
  - id: genai_expected_attribute_missing
    context:
      operation: chat
      missing_attribute: gen_ai.response.id
    reason: does not return response id
  - id: genai_expected_attribute_missing
    context:
      operation: chat
      missing_attribute: gen_ai.response.model
    reason: does not return response model
  - id: genai_expected_attribute_missing
    context:
      operation: chat
      missing_attribute: gen_ai.response.finish_reasons
    reason: does not return finish reasons

scenarios:
  chat:
    run: opentelemetry-instrument python chat.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  streamed_chat:
    run: opentelemetry-instrument python streamed_chat.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.request.stream: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk

  tool_definitions:
    run: opentelemetry-instrument python tool_definitions.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.tool.definitions:
              present: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  multimodal:
    run: opentelemetry-instrument python multimodal.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.input.messages:
              present: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
